# Runs RAPTOR's tests automatically on GitHub.
# Put this file in your repo at: .github/workflows/tests.yml

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # also lets you start it by hand from the Actions tab

# If you push again while a run is going, stop the old run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false      # one failing Python version does not hide the others
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg       # plots without a screen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            setup.py
            requirements.txt

      - name: Install RAPTOR with the test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check that the package and the command line load
        run: |
          python -c "import raptor; print('RAPTOR', raptor.get_version())"
          raptor --help

      - name: Look for real bugs (syntax errors, undefined names)
        run: flake8 raptor --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run the tests
        run: pytest tests -q --cov=raptor --cov-report=term-missing
